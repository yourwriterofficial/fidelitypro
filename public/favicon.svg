<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="rpmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00674F" />
      <stop offset="100%" stop-color="#004D3B" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Squircle with #00674F -->
  <rect width="512" height="512" rx="128" fill="url(#rpmGrad)" />
  <!-- Subtle Border Ring -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.2" />
  <!-- Central Text "RPM" in crisp white -->
  <text x="50%" y="53%" dominant-baseline="central" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="168" fill="#ffffff" letter-spacing="-2">RPM</text>
  <!-- Accent Dot -->
  <circle cx="256" cy="405" r="12" fill="#34d399" />
</svg>